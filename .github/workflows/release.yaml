name: release

# THE ONE PLACE THIS REPOSITORY DEFINES ITS OWN CI, and the exception is
# argued rather than assumed. D62 puts CI in `yadgarhq/actions` because ~61
# repositories would otherwise hold ~61 copies of one definition — and
# `ci-release.yaml` there builds an image and packages a chart, detecting exactly
# `Containerfile` and `chart`. This repository has neither. What it ships is a
# WHEEL to PyPI (D75), which is a different artifact with a different shape: not
# one build on one Linux runner, but six, one per platform, each on a runner of
# that platform.
#
# So the shared workflow was not bent to fit; a matrix it cannot express lives
# here. That is D62 honoured rather than broken: its argument is about
# DUPLICATION, and this is the only repository in the organisation that ships a
# wheel. The moment a second one exists, this belongs in `actions` — moving it
# there before then would be inventing a shared abstraction with one consumer.
#
# SIX TARGETS, and each is a real installation somebody has: Linux, macOS and
# Windows on x86_64 and aarch64. `pipx install yaadgaar` has to work on all of
# them, and a wheel is per-platform — publishing only what the CI runner happens
# to be is how "it installs everywhere" quietly becomes "it installs on Linux".

on:
  push:
    tags: ["v*"]
  # Buildable without publishing, so the matrix can be exercised without cutting
  # a release. The publish job is gated on the tag, not on this.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NATIVE RUNNERS FOR EVERY TARGET, deliberately, rather than cross-compiling
  # four of the six from an x86 Linux box. reqwest's `rustls` feature pulls
  # aws-lc-rs, which compiles C and assembly; cross-toolchains for that are the
  # part of a wheel matrix that breaks, and it breaks on the release tag, which
  # is the worst possible moment to discover it. GitHub now hosts arm64 runners
  # for Linux and Windows, so there is no longer a reason to cross-compile.
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every target is built even when one fails. A partial matrix tells you
      # which platforms are broken; a cancelled one tells you only the first.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: auto
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            # NOT `auto`, and not 2_17. The older manylinux image fails to build
            # this target — the same finding astral hit on uv, recorded there
            # against a specific failed run rather than guessed.
            manylinux: "2_28"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: auto
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64
            manylinux: auto
          - name: windows-x86_64
            runner: windows-latest
            target: x64
            manylinux: auto
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE TAG IS THE VERSION, so the wheel is told it rather than reading
      # whatever Cargo.toml happens to hold. `ci-pr.yaml`'s `version` job cuts
      # the tag and, by design, edits no manifest — the same contract
      # `ci-release.yaml` keeps by passing the tag to the image build and to
      # `helm package --version`. Without this, the merge that cut v0.1.1 built
      # wheels named 0.1.0a8 and PyPI refused them as already existing.
      #
      # `scripts/stamp-version` carries the rules (lock echo, CRLF, plain
      # MAJOR.MINOR.PATCH only) and is exercised on every pull request by
      # `ci.yaml`'s `stamp` job, so a format change fails a PR and not this tag
      # (ledger 1521).
      - name: stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          scripts/stamp-version "${GITHUB_REF_NAME#v}"
          echo "Stamped version ${GITHUB_REF_NAME#v} from $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # Scoped to Linux by the action's own definition ("control the
          # manylinux platform tag on linux"), so the value the four non-Linux
          # legs carry is inert. Passed uniformly anyway rather than making the
          # matrix rows differ in shape.
          manylinux: ${{ matrix.manylinux }}
          # `--locked`: the wheel is built from Cargo.lock, not from whatever
          # the registry resolves to that morning. A release nobody can
          # reproduce is a release nobody can bisect.
          args: --release --locked --out dist
          # Off on a tag. sccache makes iteration fast and makes a release
          # depend on a cache, and a cache is a thing that can be wrong.
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  # PUBLISHED ONLY FROM A TAG, and only after all six built. Six wheels is what
  # the promise means: shipping the four that worked would leave two platforms
  # installing an older version with no error anywhere.
  publish:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the workflow's own OIDC identity, so there is no
    # long-lived API token to hold, leak or rotate. Same argument D61 makes for
    # signing images with the workflow identity rather than a key.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: every target produced a wheel
        run: |
          set -euo pipefail
          count=$(find dist -name '*.whl' | wc -l)
          find dist -name '*.whl' -printf '- %f\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -ne 6 ]; then
            echo "::error::expected 6 wheels, found $count"
            exit 1
          fi

      # THE LAST CHANCE TO CATCH A WHEEL THAT IS NOT THE TAG, and it is checked
      # here rather than trusted from the stamp step: a PyPI file is permanent,
      # so a wrong version uploaded is a version number burned for good.
      #
      # EVERY FILE IN dist, not only `*.whl` (ledger 1521): the publish step
      # uploads the whole directory, so an sdist or a stray file added later
      # would otherwise go to PyPI unchecked. Anything that is not a wheel of
      # the tag's version is refused.
      - name: every file is a wheel carrying the tag's version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          wrong=$(find dist -type f ! -name "yaadgaar-${version}-*.whl" -printf '%f ')
          if [ -n "$wrong" ]; then
            echo "::error::not a wheel versioned ${version} (tag ${GITHUB_REF_NAME}): ${wrong}"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
