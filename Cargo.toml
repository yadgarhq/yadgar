[package]
name = "yaadgaar"
# RESOLVED — the reasoning below is kept because it still binds, and because
# deleting it invites somebody to "fix" the name back to `yadgar`. Recorded here
# rather than in a document, because this is the file the number is read from.
#
# `yadgar` ALREADY EXISTS ON PyPI, at 5.193.0: the Python client this replaces.
# `pipx install yadgar` resolves the HIGHEST version, so publishing 0.1.0 under
# that name would succeed and then never be installed — every existing user
# would keep getting 5.193.0, silently, with no error anywhere. That is
# precisely the regression D75 says a rewrite may not cause.
#
# THE PROJECT NAME IS `yaadgaar`, AND THIS VERSION SERIES IS ITS OWN, starting
# at 0.x. This client is not a continuation of the Python one — it is the client
# for the new system, and it inherits neither that client's numbers nor its
# history. `yadgar` keeps its name and keeps its 5.x series. Both have to be
# installable at once because they are INCOMPATIBLE — this client cannot work
# against the Python yadgar — so a premature rename takes a working install away
# rather than merely colliding on PATH (ADR-0505).
#
# `0.1.0` PROPER IS NOT CLAIMED YET: ADR-0498 gives the real version number to
# the first release that does something, so the value below is a prerelease on
# purpose and stays one until then.
#
# Rejected for the transitional release: 6.0.0, to out-rank 5.193.0. Under a
# separate project name there is nothing to out-rank, because no resolver ever
# compares the two, so the major bump would change no behaviour and would assert
# a lineage that does not exist. That rejection is scoped, not permanent: the
# name holds at `yaadgaar` until the new system is fully functional, and whether
# `yadgar` is reclaimed afterwards is an open decision rather than a scheduled
# one (ADR-0505). If it is ever taken, exactly two routes make the reclaimed
# name installable — publish above the Python client's highest version, or yank
# the Python 5.x files under PEP 592 — and this file chooses neither.
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The yadgar client: one binary that logs in, proxies MCP to the gateway, and owns the agent environment (D75, D76)."

# NAMED EXPLICITLY, because the package name and the binary name being the same
# word is a coincidence that must not be relied on. maturin packages whatever
# Cargo produces, and `pipx install yaadgaar` must put `yaadgaar` on the PATH.
[[bin]]
# The BINARY is renamed too, not only the PyPI project.
#
# The Python client installs an executable called `yadgar`. Two projects
# installing the same executable name collide on PATH and cannot coexist — one
# reason for publishing under a separate name during the transition, and the
# weaker one. The incompatibility recorded in `[package]` above is why both must
# coexist at all (ADR-0505). So the command is `yaadgaar`, and the MCP
# registration and hook entries name it explicitly. Both can be installed at
# once, and which one runs is never ambiguous.
name = "yaadgaar"
path = "src/main.rs"

[dependencies]
# HTTP TO THE GATEWAY, and nothing else. No tonic, no prost, no proto: the
# client speaks MCP over HTTPS and the gateway does the translation (D16, D75).
# It also holds no database — there is no sqlx and no yadgar-store here, for the
# reason a logic service has none (D4).
#
# `default-features = false` is a PIN, not a fix. In reqwest 0.13 `default-tls`
# already resolves to `rustls` — but that is upstream's default, and D63 forbids
# native-tls in this tree regardless of what upstream defaults to next. Naming
# the features is what makes the rule enforced here rather than inherited.
#
# The three non-TLS defaults are restated deliberately:
#   charset       reqwest's own default; dropping it silently changes decoding
#   http2         the gateway serves h2, and h1-only would work while being slower
#   system-proxy  THE CLIENT RUNS ON LAPTOPS. Behind a corporate proxy, a client
#                 that ignores the system proxy simply cannot reach anything, and
#                 the error is a timeout that names nothing.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "charset",
  "http2",
  "system-proxy",
  "json",
] }

clap = { version = "4", features = ["derive"] }

# `io-std` and `io-util` are both load-bearing for `serve`: the first gives the
# async stdin/stdout the MCP stdio transport is, the second gives the BufReader
# and `AsyncBufReadExt` that turn it into lines. `process` is for the install
# path, which resolves and probes the agent client's own command (D76).
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
  "process",
] }

serde = { version = "1", features = ["derive"] }

# `preserve_order` IS REQUIRED, not a nicety. `install` rewrites `~/.claude.json`
# — a file the agent client owns and yadgar only visits — and without this
# serde_json reserialises it with its ~40 top-level keys in alphabetical order.
# Nothing is lost and every line has moved, so the person opens a whole-file diff
# they did not ask for and cannot easily read. Preserving insertion order costs
# one feature flag (it swaps the map for `indexmap`) and is the difference
# between a two-line diff and an unreviewable one.
serde_json = { version = "1", features = ["preserve_order"] }

# Two error crates, and the split is deliberate. `thiserror` for the typed errors
# a caller matches on — `ConfigError::Missing` is the difference between "log in"
# and "this file is corrupt", and a string cannot carry that. `anyhow` for the
# top of `main` and the proxy loop, where the only thing left to do is print.
thiserror = "2"
anyhow = "1"

tracing = "0.1"
# `env-filter` so RUST_LOG works. NO `json` feature: this process logs for one
# person at a terminal, not for a scraper — the gateway is what emits structured
# records (D67), and the client is not a service.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The config directory, per platform. `~/.config/yadgar` on Linux is not the
# answer on macOS or Windows, and hardcoding it is how a client works on the
# machine it was written on.
dirs = "6"

# The password prompt at login, which must not echo and must not land in shell
# history — the two ways a credential leaks from an interactive CLI.
rpassword = "7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
# ONE REAL SOCKET, for the two properties no unit test can reach.
#
# The credential is attached inside the request builder, so the only way to
# assert it is actually sent is to read a request off a socket — deleting
# `.bearer_auth(...)` broke nothing that was being checked, and attaching the
# credential is the entire reason this shim exists rather than the agent talking
# to the gateway directly (D75). The same server pins that a non-2xx status is
# not treated as an answer, and that a refusal is told apart from an outage.
#
# `net` is here rather than in the runtime dependency above because nothing in
# the client ever binds or listens; only the tests do.
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util"] }
